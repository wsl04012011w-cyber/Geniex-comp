name: Experimental GenieX OpenCL + isolated Hexagon APK

on:
  push:
    branches: [experiment/localdream-npu-isolation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geniex-isolated-hexagon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-experimental-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout pinned GenieX SDK
        uses: actions/checkout@v4
        with:
          repository: qualcomm/GenieX
          ref: 071f609995470bdb0e0769ab964754adfaab7e47
          path: geniex
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Initialize llama.cpp submodule
        run: git -C geniex submodule update --init --depth=1 third-party/llama.cpp

      - name: Keep HTP KV cache and RoPE off the Hexagon buffer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("geniex/sdk/plugins/llama_cpp/src/params.cpp")
          source = path.read_text()
          needle = "    cpar.no_perf              = false;"
          replacement = """    cpar.no_perf              = false;

              // HTP cannot execute every KQV/RoPE view used by llama.cpp's KV cache.
              // Keep KV cache and RoPE on CPU while supported model layers remain on HTP.
              if (device == Device::NPU) {
                  cpar.offload_kqv = false;
                  GENIEX_LOG_INFO("[Hexagon] offload_kqv=false: KV cache and RoPE stay on CPU");
              }"""
          if source.count(needle) != 1:
              raise SystemExit("Could not locate unique context-parameter insertion point")
          path.write_text(source.replace(needle, replacement))
          PY

      - name: Keep the LLM session alive between streamed turns
        run: |
          python3 -c 'from pathlib import Path; p=Path("geniex/bindings/android/app/src/main/java/com/geniex/sdk/LlmWrapper.kt"); s=p.read_text(); nl=chr(10); old="        awaitClose {" + nl + "            close()" + nl + "        }"; new="        awaitClose {" + nl + "            if (handle != 0L) runCatching { llm.stopStream(handle) }" + nl + "        }"; assert s.count(old) == 1, "LlmWrapper cleanup block mismatch"; p.write_text(s.replace(old, new))'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "platforms;android-35" "build-tools;35.0.0" \
            "cmake;3.22.1" "ndk;27.3.13750724" "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache native build objects
        uses: actions/cache@v4
        with:
          path: .ccache
          key: geniex-android-opencl-hexagon-v0.10.0-armv8a
          restore-keys: geniex-android-opencl-hexagon-v0.10.0-

      - name: Build baseline ARMv8-A GGML Hexagon + OpenCL SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ccache
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/app" \
            -v "$GITHUB_WORKSPACE/geniex:/workspace" \
            -v "$GITHUB_WORKSPACE/.ccache:/workspace/.ccache" \
            -w /workspace \
            -e APP_WORKSPACE=/app \
            -e GENIEX_VERSION=v0.10.0 \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime \
            -e HOST_UID="$uid" \
            -e HOST_GID="$gid" \
            --platform linux/amd64 \
            docker.io/qualcomm/geniex-toolchain-android:v0.2.0 \
            bash -eux -c '
              git config --global --add safe.directory "*"
              OPENCL_SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
              OPENCL_INCLUDE_DIR="$OPENCL_SYSROOT/usr/include"
              OPENCL_LIBRARY="$OPENCL_SYSROOT/usr/lib/aarch64-linux-android/libOpenCL.so"
              test -f "$OPENCL_INCLUDE_DIR/CL/cl.h"
              test -f "$OPENCL_LIBRARY"
              : "${HEXAGON_SDK_ROOT:?Hexagon SDK missing from toolchain image}"
              : "${HEXAGON_TOOLS_ROOT:?Hexagon tools missing from toolchain image}"

              # Use the baseline ARMv8-A host toolchain but enable HTP separately.
              cmake -S sdk --preset arm64-android-cpu-release \
                -B sdk/build-arm64-android-hexagon-baseline \
                -DGENIEX_VERSION="$GENIEX_VERSION" \
                -DGENIEX_PLUGIN_LLAMA_CPP=ON \
                -DGENIEX_PLUGIN_QAIRT=OFF \
                -DGENIEX_CPU_ONLY=ON \
                -DGGML_HEXAGON=ON \
                -DGGML_OPENCL=ON \
                -DGGML_OPENMP=OFF \
                -DGENIEX_BENCHMARK=OFF \
                -DOpenCL_INCLUDE_DIR="$OPENCL_INCLUDE_DIR" \
                -DOpenCL_LIBRARY="$OPENCL_LIBRARY" \
                -DHEXAGON_SDK_ROOT="$HEXAGON_SDK_ROOT" \
                -DHEXAGON_TOOLS_ROOT="$HEXAGON_TOOLS_ROOT" \
                -DHEXAGON_HTP_CERT="${HEXAGON_HTP_CERT:-}" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

              cmake --build sdk/build-arm64-android-hexagon-baseline -j "$(nproc)"
              rm -rf sdk/pkg-geniex-full sdk/pkg-geniex
              cmake --install sdk/build-arm64-android-hexagon-baseline --prefix sdk/pkg-geniex-full
              test -f sdk/pkg-geniex-full/lib/llama_cpp/libgeniex_plugin.so
              test -f sdk/pkg-geniex-full/lib/llama_cpp/libggml-hexagon.so
              test -f sdk/pkg-geniex-full/lib/llama_cpp/libggml-opencl.so
              test -f sdk/pkg-geniex-full/lib/llama_cpp/libggml-htp-v73.so
              if find sdk/pkg-geniex-full -name "libgeniex_plugin_qairt.so" | grep -q .; then
                echo "QAIRT must remain disabled in this GGML Hexagon experiment"
                exit 1
              fi

              # The worker gets the complete HTP runtime as private assets.
              rm -rf "$APP_WORKSPACE/src/main/assets/npu_runtime/llama_cpp"
              mkdir -p "$APP_WORKSPACE/src/main/assets/npu_runtime/llama_cpp"
              cp sdk/pkg-geniex-full/lib/llama_cpp/*.so \
                "$APP_WORKSPACE/src/main/assets/npu_runtime/llama_cpp/"

              # Build a second, independent CPU/OpenCL SDK for the main process.
              # Do not strip Hexagon from the HTP build: its plugin has a DT_NEEDED
              # dependency on libggml-hexagon.so, so deleting the library makes
              # CPU/GPU plugin registration fail with dlopen / "plugin not found".
              cmake -S sdk --preset arm64-android-cpu-release \
                -B sdk/build-arm64-android-cpu-opencl-baseline \
                -DGENIEX_VERSION="$GENIEX_VERSION" \
                -DGENIEX_PLUGIN_LLAMA_CPP=ON \
                -DGENIEX_PLUGIN_QAIRT=OFF \
                -DGENIEX_CPU_ONLY=ON \
                -DGGML_HEXAGON=OFF \
                -DGGML_OPENCL=ON \
                -DGGML_OPENMP=OFF \
                -DGENIEX_BENCHMARK=OFF \
                -DOpenCL_INCLUDE_DIR="$OPENCL_INCLUDE_DIR" \
                -DOpenCL_LIBRARY="$OPENCL_LIBRARY" \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

              cmake --build sdk/build-arm64-android-cpu-opencl-baseline -j "$(nproc)"
              cmake --install sdk/build-arm64-android-cpu-opencl-baseline --prefix sdk/pkg-geniex
              test -f sdk/pkg-geniex/lib/llama_cpp/libgeniex_plugin.so
              test -f sdk/pkg-geniex/lib/llama_cpp/libggml-opencl.so
              if find sdk/pkg-geniex/lib/llama_cpp \
                \\( -name "libggml-hexagon.so" -o -name "libggml-htp-*.so" \\) | grep -q .; then
                echo "CPU/OpenCL SDK unexpectedly contains Hexagon/HTP libraries"
                exit 1
              fi
              chown -R "$HOST_UID:$HOST_GID" sdk .ccache
            '

      - name: Verify split Hexagon worker assets and UI AAR staging
        run: |
          set -euo pipefail
          test -f src/main/assets/npu_runtime/llama_cpp/libgeniex_plugin.so
          test -f src/main/assets/npu_runtime/llama_cpp/libggml-hexagon.so
          test -f src/main/assets/npu_runtime/llama_cpp/libggml-htp-v73.so
          test -f geniex/sdk/pkg-geniex/lib/llama_cpp/libggml-opencl.so
          if find geniex/sdk/pkg-geniex/lib/llama_cpp \
            \( -name "libggml-hexagon.so" -o -name "libggml-htp-*.so" \) | grep -q .; then
            echo "Hexagon backend artifacts leaked into the UI AAR staging package"
            exit 1
          fi

      - name: Build the app's CPU/OpenCL AAR
        working-directory: geniex/bindings/android
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Stage baseline AAR for the app
        run: |
          set -euo pipefail
          mkdir -p libs artifacts
          cp geniex/bindings/android/app/build/outputs/aar/app-release.aar libs/geniex-android.aar
          cp libs/geniex-android.aar artifacts/GenieX-Android-CPU-OpenCL.aar
          unzip -Z1 libs/geniex-android.aar > /tmp/geniex-main-aar.txt
          grep -q 'jni/arm64-v8a/libgeniex_plugin_llama_cpp.so' /tmp/geniex-main-aar.txt
          grep -q 'jni/arm64-v8a/libggml-opencl.so' /tmp/geniex-main-aar.txt
          if grep -Eq 'libggml-hexagon.so|libggml-htp-v[0-9]+.so|libgeniex_plugin_qairt.so' /tmp/geniex-main-aar.txt; then
            echo "The UI-process AAR must not contain Hexagon/HTP/QAIRT libraries"
            exit 1
          fi
          # Check ELF dependencies too: a missing backend file can still leave
          # the plugin with a DT_NEEDED entry that prevents dlopen at startup.
          unzip -p libs/geniex-android.aar jni/arm64-v8a/libgeniex_plugin_llama_cpp.so > /tmp/geniex-ui-llama-plugin.so
          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d /tmp/geniex-ui-llama-plugin.so > /tmp/geniex-ui-llama-plugin.dynamic
          if grep -Eq 'libggml-hexagon.so|libggml-htp-' /tmp/geniex-ui-llama-plugin.dynamic; then
            echo "CPU/OpenCL UI plugin still depends on Hexagon/HTP"
            cat /tmp/geniex-ui-llama-plugin.dynamic
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build experimental Android APK
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleDebug

      - name: Verify process-separated APK contents
        run: |
          set -euo pipefail
          APK=build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > /tmp/geniex-apk-files.txt
          grep -q 'lib/arm64-v8a/libgeniex_plugin_llama_cpp.so' /tmp/geniex-apk-files.txt
          grep -q 'lib/arm64-v8a/libggml-opencl.so' /tmp/geniex-apk-files.txt
          grep -q 'assets/npu_runtime/llama_cpp/libgeniex_plugin.so' /tmp/geniex-apk-files.txt
          grep -q 'assets/npu_runtime/llama_cpp/libggml-hexagon.so' /tmp/geniex-apk-files.txt
          if grep -q 'lib/arm64-v8a/libggml-hexagon.so' /tmp/geniex-apk-files.txt; then
            echo "Hexagon library leaked into the UI process native library directory"
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload experimental APK and baseline AAR
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-Android-OpenCL-Isolated-Hexagon-debug
          path: |
            build/outputs/apk/debug/app-debug.apk
            artifacts/GenieX-Android-CPU-OpenCL.aar
          if-no-files-found: error
          retention-days: 14
