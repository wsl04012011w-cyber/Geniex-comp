name: Build GenieX Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android project
        run: |
          test -f build.gradle
          test -f src/main/AndroidManifest.xml
          test -f src/main/java/com/geniex/demo/DebugLogCollector.kt

      - name: Commit imported source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Qualcomm GenieX Android demo"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Download CPU-only GenieX Android SDK
        run: |
          mkdir -p libs
          SDK_URL="https://github.com/qualcomm/GenieX/releases/download/v0.10.0/geniex-android-aar-cpu-v0.10.0.aar"
          curl -fL --retry 3 "$SDK_URL" -o libs/geniex-android.aar
          echo "7b3ac1b8c49a0eec409492dc799ed1b75069d72e41311833349167ca84c71af3  libs/geniex-android.aar" | sha256sum --check --strict

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-Android-debug
          path: build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
